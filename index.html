<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saanidhya & Deva — The Quiz 💝</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💝</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0610; overflow-x: hidden; }
    
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.12; } 90% { opacity: 0.12; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentlePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes revealSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scoreReveal {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes softGlow {
      0%,100% { box-shadow: 0 0 20px rgba(212,160,110,0.08); }
      50% { box-shadow: 0 0 35px rgba(212,160,110,0.15); }
    }
    .quiz-fade { transition: opacity 0.4s ease; }
    .quiz-fade-in { opacity: 1; } .quiz-fade-out { opacity: 0; }
    
    .opt-btn {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 15px 18px;
      color: #f2e8d8; font-family: 'Nunito', sans-serif;
      font-size: 14.5px; font-weight: 500; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      text-align: left; width: 100%;
      display: flex; align-items: center; gap: 12px;
    }
    .opt-btn:hover:not(.picked):not(.dim) {
      background: rgba(212,160,110,0.06);
      border-color: rgba(212,160,110,0.25);
      transform: translateX(3px);
    }
    .opt-btn.right {
      background: rgba(162,210,140,0.1);
      border-color: rgba(162,210,140,0.45);
      box-shadow: 0 0 18px rgba(162,210,140,0.08);
    }
    .opt-btn.wrong {
      background: rgba(220,120,110,0.08);
      border-color: rgba(220,120,110,0.35);
    }
    .opt-btn.dim { cursor: default; opacity: 0.45; }
    .opt-lbl {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .right .opt-lbl { background: rgba(162,210,140,0.2); border-color: rgba(162,210,140,0.5); }
    .wrong .opt-lbl { background: rgba(220,120,110,0.2); border-color: rgba(220,120,110,0.5); }
    
    .photo-fr {
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 6px 28px rgba(0,0,0,0.35), 0 0 40px rgba(212,160,110,0.06);
      border: 1.5px solid rgba(212,160,110,0.15);
      animation: softGlow 4s ease infinite;
    }
    .photo-fr img { width: 100%; display: block; }
    
    .cta-btn {
      background: linear-gradient(135deg, #d4a06e, #c48a5a, #b87a4e);
      color: #0a0610; border: none;
      padding: 16px 44px; border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 15.5px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(212,160,110,0.25);
    }
    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(212,160,110,0.35); }
    
    .next-btn {
      background: rgba(212,160,110,0.1);
      border: 1px solid rgba(212,160,110,0.3);
      color: #d4a06e; padding: 13px 32px;
      border-radius: 50px; font-family: 'Nunito', sans-serif;
      font-size: 14.5px; font-weight: 600; cursor: pointer;
      transition: all 0.3s;
    }
    .next-btn:hover { background: rgba(212,160,110,0.18); transform: translateY(-1px); }
    
    .timeline-dot {
      width: 7px; height: 7px; border-radius: 50%;
      transition: all 0.35s;
    }
  </style>
</head>
