<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey You ❤️</title>

<style>
    body {
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background: linear-gradient(135deg,#ffd6e7,#ffe9f3);
        overflow:hidden;
    }

    .card {
        text-align:center;
        background:white;
        padding:40px;
        border-radius:20px;
        box-shadow:0 20px 60px rgba(0,0,0,0.1);
        max-width:500px;
        position:relative;
    }

    h1 {
        margin-bottom:20px;
        color:#ff4f8b;
    }

    p {
        color:#555;
        margin-bottom:30px;
        font-size:18px;
    }

    .buttons {
        position:relative;
        height:120px;
    }

    button {
        padding:14px 28px;
        border:none;
        border-radius:12px;
        font-size:18px;
        cursor:pointer;
        transition: all 0.25s ease;
        position:absolute;
    }

    #yesBtn {
        background:#ff4f8b;
        color:white;
        left:30%;
    }

    #noBtn {
        background:#eee;
        color:#444;
        left:55%;
    }

    .bigYes {
        transform: scale(1.2);
    }

    .success {
        font-size:26px;
        color:#ff4f8b;
        margin-top:20px;
        display:none;
    }
</style>
</head>
<body>

<audio id="bgMusic" autoplay loop>
    <source src="the-night-we-met.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>Will you go on an online date with me? 💌</h1>
    <p>I promise good vibes, bad jokes, and full attention 😌 <br><small>(try pressing no — just for fun)</small></p>

    <div class="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No 🙈</button>
    </div>

    <div class="success" id="successMsg">YAY!! I knew you'd say yes 🥹✨</div>
</div>

<script>

let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let successMsg = document.getElementById("successMsg");

let scale = 1;

noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    scale += 0.15;
    yesBtn.style.transform = `scale(${scale})`;
});

yesBtn.addEventListener("click", function() {
    successMsg.style.display = "block";
    yesBtn.innerText = "See you on our date 😌❤️";
    createConfetti();
});

function createConfetti() {
    for (let i = 0; i < 80; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.background = "#ff4f8b";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = "-10px";
        confetti.style.opacity = Math.random();
        confetti.style.borderRadius = "50%";
        confetti.style.transition = "transform 3s linear, top 3s linear";
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.style.top = window.innerHeight + "px";
            confetti.style.transform = `translateX(${Math.random()*200-100}px)`;
        }, 10);

        setTimeout(() => {
            confetti.remove();
        }, 3000);
    }
}

</script>

</body>
</html>
